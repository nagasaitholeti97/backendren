
spring:
  application:
    name: sams-backend

  mail:
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USER:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail.smtp.auth: true
      mail.smtp.starttls.enable: true
      mail.smtp.connectiontimeout: 5000
      mail.smtp.timeout: 5000
      mail.smtp.writetimeout: 5000

  datasource:
    url: ${DATABASE_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate:
        format_sql: false
        dialect: org.hibernate.dialect.PostgreSQLDialect

server:
  port: ${PORT:8080}

sams:
  minimum-percentage: 75
  demo-today: "2026-11-11"
  seed-demo-data: true
  jwt:
    secret: ${SAMS_JWT_SECRET:change-this-development-secret-to-at-least-32-characters}
    ttl-minutes: 120
  cors:
    allowed-origins: "http://localhost:*,http://127.0.0.1:*"
